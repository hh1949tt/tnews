    label: 国内
    desc: 时政、政策、民生要闻
    feeds:
      - { name: 中国新闻网·时政, url: "https://www.chinanews.com.cn/rss/china.xml" }
      - { name: 新浪新闻·国内,   url: "https://rss.sina.com.cn/news/china/focus15.xml" }
      - { name: 人民网·时政,     url: "http://www.people.com.cn/rss/politics.xml" }

  world:
    label: 国际
    desc: 全球局势、外交动态
    feeds:
      - { name: 中国新闻网·国际, url: "https://www.chinanews.com.cn/rss/world.xml" }
      - { name: 新浪新闻·国际,   url: "https://rss.sina.com.cn/news/world/focus15.xml" }
      - { name: 人民网·国际,     url: "http://www.people.com.cn/rss/world.xml" }
      - { name: BBC 中文,        url: "https://feeds.bbci.co.uk/zhongwen/simp/rss.xml" }
      - { name: 联合早报,        url: "https://www.zaobao.com.sg/rss/realtime/world" }

  finance:
    label: 财经
    desc: 市场、公司、宏观
    feeds:
      - { name: 华尔街见闻,      url: "https://dedicated.wallstreetcn.com/rss.xml" }
      - { name: 中国新闻网·财经, url: "https://www.chinanews.com.cn/rss/finance.xml" }
      - { name: 人民网·财经,     url: "http://www.people.com.cn/rss/finance.xml" }
      - { name: 36氪,            url: "https://36kr.com/feed" }

  tech:
    label: 科技
    desc: 互联网、数码、AI
    feeds:
      - { name: IT之家,          url: "https://www.ithome.com/rss/" }
      - { name: 少数派,          url: "https://sspai.com/feed" }
      - { name: 36氪,            url: "https://36kr.com/feed" }
      - { name: cnBeta,          url: "https://www.cnbeta.com.tw/backend.php" }
      - { name: 爱范儿,          url: "https://www.ifanr.com/feed" }
      - { name: 人民网·IT,       url: "http://www.people.com.cn/rss/it.xml" }

  society:
    label: 社会
    desc: 民生、事件、法治
    feeds:
      - { name: 中国新闻网·社会, url: "https://www.chinanews.com.cn/rss/society.xml" }
      - { name: 新浪新闻·社会,   url: "https://rss.sina.com.cn/news/society/focus15.xml" }
      - { name: 人民网·社会,     url: "http://www.people.com.cn/rss/society.xml" }
      - { name: 中国新闻网·滚动, url: "https://www.chinanews.com.cn/rss/scroll-news.xml" }

  sports:
    label: 体育
    desc: 赛事、球队、运动员
    feeds:
      - { name: 中国新闻网·体育, url: "https://www.chinanews.com.cn/rss/sports.xml" }
      - { name: 人民网·体育,     url: "http://www.people.com.cn/rss/sports.xml" }

  entertainment:
    label: 文娱
    desc: 影视、演出、明星
    feeds:
      - { name: 人民网·娱乐,     url: "http://www.people.com.cn/rss/ent.xml" }
