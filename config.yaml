# ---------------- 节目（定时任务） ----------------
# 每档节目 = 一个抓取时间窗口 + 一组分类 + 一个定时器
# 节目名只是这一档的叫法，不绑定使用时段（几点听都行），改个自己喜欢的即可
# 只保留一档节目就够了（网页里也不会再出现两个不同的节目名）：同一天可以定多个生成时刻
# 时间窗口二选一：
#   lookback_hours: 抓取最近 N 小时
#   window: { start: "20:00", end: "07:30" }  固定时段（end < start 表示跨天）
# crons 用标准 5 段格式（分 时 日 月 周），可写多条；时区在 server 里统一为 Asia/Shanghai
programs:
  - id: morning
    name: 要闻速听
    # 早 7:30 和晚 18:00 各生成一期，期数在这同一档里连续往下排（第 N 期）
    crons: ["30 7 * * *", "0 18 * * *"]
    lookback_hours: 12
    categories: [domestic, world, finance, tech, society, hot]

# ---------------- 首页访客 ----------------
# 没登录的人打开首页时，默认看到谁的内容：指向管理员（admin）的生成。
# 前提：该账号在网页「我的账号 → 速听分享」里是【开启】状态。
#   - 开启：访客打开首页就像打开该账号的速听分享地址，只能听、不能生成
#   - 该账号关闭了「速听分享」：访客打开首页没有内容，提示需要登录
# 指向哪个账号也可以在网页里改：设置 → 全局管理 → 首页访客指向（网页里的选择优先于这里）。
# 不写这一段（整个 guest 段删掉）= 保持旧行为：访客始终能听管理员的节目
guest:
  enabled: true        # false = 关闭首页访客收听：访客打开首页无内容，提示登录
  account: ""          # 指向哪个账号：登录名 / 邮箱 / 6 位用户 ID；留空 = 主管理员

# ---------------- 自动更新 ----------------
# 除上面的定点定时任务外，还可以「每隔 N 小时自动生成一期」（在页面设置面板里也能改，
# 页面里改过的值会存在数据库里，优先级高于这里）
auto_update:
  enabled: false
  interval_hours: 6      # 每隔几小时生成一期
  program_id: ""         # 用哪一档节目的分类/音色，留空 = 第一档

# 保留多少天的音频文件（自动清理旧文件）
retention_days: 14
