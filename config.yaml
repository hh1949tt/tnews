# ============================================================
#  TNews · 配置文件
#  逐项说明见 docs/configuration.md；改完重启服务生效（docker compose restart）
#  提示：这段配置只是「默认值」，页面里改过的设置存在数据库里，优先级更高
# ============================================================

# 应用名称：显示在网页标题、页面左上角、播客订阅源里，可改成自己喜欢的
app_name: "TNews"

# 项目主页（GitHub / Gitee 等）：显示在首页底部，也是管理员「设置 → 全局管理 → 版本更新」的检查来源。
# 留空 = 首页不显示入口、也不检查更新。例：https://github.com/your-name/tnews
repo_url: "https://github.com/hh1949tt/tnews"

server:
  host: "0.0.0.0"
  port: 18282
  # 播客订阅源里音频的绝对地址前缀。
  # 留空 = 自动按请求推断（局域网可用）；
  # 要做公网播客订阅就填，例如 "https://news.mydomain.com"
  public_base_url: ""
  # 打开页面时，如果最新一期已经超过 N 小时，自动补录一期（防止错过定时任务）
  auto_generate_on_open: true
  auto_generate_min_age_hours: 6

# ---------------- 生成完成通知（可选，给 Home Assistant 等外部系统） ----------------
home_assistant:
  # 每期生成完成后 POST 一条 JSON 到这个地址（留空 = 不推送）
  # 在 HA 里新建「Webhook」触发的自动化后，回调地址形如：
  #   http://192.168.1.50:8123/api/webhook/tnews_new_episode
  webhook_url: ""
  # 推送内容里音频地址的前缀（必须填 HA 能访问到的地址，否则只给相对路径）
  # 例：http://192.168.1.100:18282 ；留空则沿用上面 server.public_base_url
  base_url: ""

# ---------------- 语音合成 ----------------
tts:
  # 常用中文音色：
  #   zh-CN-YunxiNeural    男声·清晰自然（默认）
  #   zh-CN-XiaoxiaoNeural 女声·温和
  #   zh-CN-YunjianNeural  男声·浑厚有力（适合新闻播报）
  #   zh-CN-XiaoyiNeural   女声·活泼
  #   zh-CN-liaoning-XiaobeiNeural 东北话
  voice: "zh-CN-YunxiNeural"
  rate: "+10%"       # 语速，通勤场景略快一些
  volume: "+0%"
  pitch: "+0Hz"
  gap_seconds: 0.45  # 条与条之间的停顿

# ---------------- 摘要 ----------------
digest:
  max_items: 14             # 一期节目最多收录多少条
  max_chars_per_item: 120   # 单条口播稿字数上限
  min_chars_per_item: 24    # 低于这个字数视为无效正文
  # 可选的大模型润色（不配置也能跑，走抽取式摘要）
  llm:
    enabled: false
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    api_key_env: "LLM_API_KEY"   # 从环境变量读 key，不要写在这里

# ---------------- 分类与订阅源 ----------------
# 页面「生成新一期」面板里可以逐项勾选分类与具体源
categories:
